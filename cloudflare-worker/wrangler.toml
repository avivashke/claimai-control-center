name = "claimai-ai-worker"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI Binding (Native platform binding)
[ai]
binding = "AI"

# Environment Variables (Non-sensitive)
[vars]
CORS_ORIGIN = "*"
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct"
GROQ_MODEL = "llama-3.3-70b-versatile"

# Secrets to configure via Cloudflare Dashboard (Settings -> Variables & Secrets) or `npx wrangler secret put`:
# - GROQ_API_KEY (Recommended: Ultra-fast LPU inference for deep customer engagement reasoning)
# - GEMINI_API_KEY (Optional: Google Gemini 1.5/2.0 fallback)
# - OPENAI_API_KEY (Optional: OpenAI GPT-4o fallback)
# - WORKER_SECRET_TOKEN (Optional: if you want to restrict API calls)
